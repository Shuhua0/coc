name: Build IPA
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project TimerTest.xcodeproj -scheme TimerTest \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Fake-sign with entitlements and package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/TimerTest.app
          ldid -SApp/App.entitlements "$APP/TimerTest"
          ldid -SWidget/Widget.entitlements "$APP/PlugIns/TimerWidget.appex/TimerWidget"
          mkdir Payload
          cp -r "$APP" Payload/
          zip -qr TimerTest.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TimerTest-ipa
          path: TimerTest.ipa
