name: iOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Xcode Archive (With Entitlements, No Sign)
        run: |
          # 프로젝트 내 entitlements 파일 경로를 지정하여 권한이 유실되지 않게 합니다.
          # 만약 파일 이름이나 경로가 다르다면 수정해주세요.
          xcodebuild -project clash_widgets.xcodeproj \
                     -scheme clash_widgets \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     -derivedDataPath build \
                     archive -archivePath build/clash_widgets.xcarchive

      - name: Package IPA
        run: |
          mkdir -p output/Payload
          echo "--- 빌드 폴더 내 .app 파일 찾는 중 ---"
          find build -name "*.app" -type d -exec cp -r {} output/Payload/ \;
          
          cd output
          ls -R Payload
          zip -r clash-widgets.ipa Payload
          echo "--- 최종 IPA 용량 확인 ---"
          ls -lh clash-widgets.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Widgets-IPA
          path: output/clash-widgets.ipa
