name: Build iOS Timer & Widget

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Create Xcode Project Structure & Build
        run: |
          mkdir -p ProjectBuild/MyTimerApp/Sources
          cp -R Sources/* ProjectBuild/MyTimerApp/Sources/
          
          cd ProjectBuild
          
          # 간단한 Swift Package 또는 커맨드라인 빌드 스크립트 구성
          swift package init --type executable || true
          
          echo "Building application..."
          # 가상 맥 환경에서 컴파일 테스트 진행
          swift build -c release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyTimerApp-Artifacts
          path: ProjectBuild/.build/release/