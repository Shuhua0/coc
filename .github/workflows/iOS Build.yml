name: iOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Xcode Archive (Simulator)
        run: |
          xcodebuild -project clash_widgets.xcodeproj \
                     -scheme clash_widgets \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -derivedDataPath build \
                     archive -archivePath build/clash_widgets.xcarchive

      - name: Package IPA
        run: |
          mkdir -p output/Payload
          echo "--- 빌드 폴더 내 .app 파일 찾는 중 ---"
          
          # build 폴더 전체에서 확장자가 .app인 디렉토리를 찾아 Payload 안으로 복사합니다.
          find build -name "*.app" -type d -exec cp -r {} output/Payload/ \;
          
          cd output
          # 내용물이 복사되었는지 확인
          ls -R Payload
          zip -r clash-widgets.ipa Payload
          echo "--- 최종 IPA 용량 확인 ---"
          ls -lh clash-widgets.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Widgets-IPA
          path: output/clash-widgets.ipa
