name: iOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Xcode Archive (Simulator)
        run: |
          xcodebuild -project clash_widgets.xcodeproj \
                     -scheme clash_widgets \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -derivedDataPath build \
                     archive -archivePath build/clash_widgets.xcarchive

      - name: Package IPA
        run: |
          mkdir -p output/Payload
          echo "--- 빌드 폴더 뒤지는 중 ---"
          # 시뮬레이터 빌드의 경우 Products/Release-iphonesimulator 경로에 .app이 생성됩니다.
          cp -r build/Products/Release-iphonesimulator/*.app output/Payload/
          
          cd output
          # 내용물이 있는지 확인
          ls -R Payload
          zip -r clash-widgets.ipa Payload
          echo "--- 최종 IPA 용량 확인 ---"
          ls -lh clash-widgets.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Widgets-IPA
          path: output/clash-widgets.ipa
