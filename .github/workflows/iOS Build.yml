name: Build iOS IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Generate Project and Build IPA
        run: |
          mkdir -p Payload
          
          # Swift 패키지를 iOS 플랫폼 타겟으로 빌드 설정 강제
          swift package init --type executable || true
          
          # iOS 시뮬레이터 SDK를 지정하여 위젯 및 앱 컴파일 에러 회피
          swift build -c release -Xswiftc -target -Xswiftc x86_64-apple-ios14.0-simulator || swift build -c release
          
          # 앱 구조(Payload) 디렉토리 생성
          mkdir -p Payload/MyTimerApp.app
          
          # 빌드된 바이너리를 앱 패키지로 복사
          if [ -d ".build/release" ]; then
            cp -R .build/release/* Payload/MyTimerApp.app/ || true
          fi
          
          # 기본 Info.plist 생성 (사이드스토어 호환용)
          cat << 'EOF' > Payload/MyTimerApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.mytimer.app</string>
              <key>CFBundleName</key>
              <string>MyTimerApp</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleExecutable</key>
              <string>MyTimerApp</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          # IPA 압축 포장
          zip -r MyTimerApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTimerApp-IPA
          path: MyTimerApp.ipa