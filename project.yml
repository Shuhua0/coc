name: TimerTest
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TimerTest:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: TimerWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.timertest
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Timer Test
        UILaunchScreen: {}
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.timertest]
  TimerWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.timertest.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Timer Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.timertest]
